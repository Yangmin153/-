name: Record actual Yeohaenggil usage video
on:
  push:
    branches: [feature/vnext-three-step-trip]
    paths:
      - scripts/record-trip-demo.mjs
      - .github/workflows/record-trip-demo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Prepare Chromium and ffmpeg
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Capture genuine website interaction
        env:
          YG_DEMO_URL: https://yeohaenggil-7ncxh7xzb-travel-alex.vercel.app/
          YG_DEMO_OUTPUT: public/media/yeohaenggil-step1-guide.mp4
        run: node scripts/record-trip-demo.mjs
      - name: Upload browser video artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yeohaenggil-actual-demo-mp4
          path: public/media/yeohaenggil-step1-guide.mp4
          if-no-files-found: error
      - name: Commit genuine video to feature branch
        if: success() && github.ref == 'refs/heads/feature/vnext-three-step-trip'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/media/yeohaenggil-step1-guide.mp4
          git commit -m "media: add actual browser recording for STEP1" || exit 0
          # Other feature commits can land while the browser records. Rebase the
          # generated media-only commit so that this push never discards them.
          for attempt in 1 2 3; do
            git fetch origin feature/vnext-three-step-trip
            git rebase origin/feature/vnext-three-step-trip
            if git push origin HEAD:feature/vnext-three-step-trip; then exit 0; fi
          done
          exit 1
      - name: Upload diagnostic screenshot if capture fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-demo-failure-screenshot
          path: ${{ runner.temp }}/yg-capture-error.png
          if-no-files-found: ignore
